# Spring DataSource Configuration
# "mysql" is the MySQL service name on the docker-compose network, resolved via Docker's
# built-in DNS - not "localhost" (which would refer to this backend container itself).
spring.datasource.url=jdbc:mysql://mysql:3306/caterpillar-db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}

# Spring Data JPA Configuration
spring.jpa.show-sql=false

# Mining Bounded Context - Serial Number Encryption (AES-256-GCM)
mining.encryption.serial-number.secret-key=${MINING_ENCRYPTION_KEY}
