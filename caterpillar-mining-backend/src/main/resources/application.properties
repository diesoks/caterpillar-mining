# Spring Application Name
spring.application.name=Caterpillar Mining Backend

# Profile
spring.profiles.active=dev

# Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.caterpillar.mining.backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
authorization.jwt.secret = WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days = 7

# Flyway Configuration
spring.flyway.enabled=false

# Mining Bounded Context - Serial Number Encryption (AES-256-GCM)
# Base64-encoded 256-bit key. Replace with a securely generated value per environment
# (e.g. openssl rand -base64 32). Do not commit a real production key to source control.
mining.encryption.serial-number.secret-key=REPLACE_WITH_BASE64_AES256_KEY

