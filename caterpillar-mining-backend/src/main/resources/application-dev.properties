# Spring DataSource Configuration
# DB_PASSWORD and MINING_ENCRYPTION_KEY have no default on purpose: the app fails fast at
# startup if they are not set, instead of silently falling back to a hardcoded secret that
# could end up committed to source control. Set them as environment variables before running
# (see the "Running manually" section in the README for exact steps).
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:caterpillar-db}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true&publicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Mining Bounded Context - Serial Number Encryption (AES-256-GCM), local development key
mining.encryption.serial-number.secret-key=${MINING_ENCRYPTION_KEY}
