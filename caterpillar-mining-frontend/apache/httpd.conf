# Minimal Apache HTTP Server configuration for the Caterpillar Mining frontend.
# Serves the compiled React static build and reverse-proxies /api/** to the Spring Boot
# backend container, so the browser only ever talks to a single origin (this Apache
# instance) and the backend never needs CORS configuration.

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

TypesConfig conf/mime.types

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

# Docker-friendly logging: write to the container's stdout/stderr so "docker logs" shows them.
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

# Reverse proxy: everything under /api/ is forwarded to the backend container.
# The "backend" hostname is resolved via the docker-compose network's built-in DNS.
ProxyPreserveHost On
ProxyPass "/api/" "http://backend:8080/api/"
ProxyPassReverse "/api/" "http://backend:8080/api/"
